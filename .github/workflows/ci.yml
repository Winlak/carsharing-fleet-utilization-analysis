name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-and-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: make install
      - name: Lint
        run: make lint
      - name: Test metric logic and SQL marts
        run: make test
      - name: Reproduce analysis, execute notebook, and confirm a clean worktree
        run: make reproduce-check
